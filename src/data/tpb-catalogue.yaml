entries:
  - id: "GS01"
    title: "TPB(GS) 01/2010: Code of Professional Conduct"
    url: "https://www.tpb.gov.au/tpb-gs-01-2010-code-professional-conduct"
    trigger: "Apply to every registered-practitioner task; use the latest 13 August 2026 update and the current TASA text."
  - id: "GS02"
    title: "TPB(GS) 02/2010: Fit and proper person"
    url: "https://www.tpb.gov.au/tpb-gs-02-2010-fit-and-proper-person"
    trigger: "Flag conduct or events that may affect registration; do not make the TPB’s determination."
  - id: "GS03"
    title: "TPB(GS) 03/2010: Course in basic accountancy principles approved by the Board"
    url: "https://www.tpb.gov.au/tpb-gs-03-2010-course-basic-accountancy-principles-approved-board"
    trigger: "Use only for course/registration questions; never infer that study or model use establishes eligibility."
  - id: "GS04"
    title: "TPB(GS) 04/2010: Course in commercial law approved by the Board"
    url: "https://www.tpb.gov.au/tpb-gs-04-2010-course-commercial-law-approved-board"
    trigger: "Route commercial-law course and registration questions to current TPB criteria."
  - id: "GS05"
    title: "TPB(GS) 05/2010: Course in Australian taxation law approved by the Board"
    url: "https://www.tpb.gov.au/tpb-gs-05-2010-course-australian-taxation-law-approved-board"
    trigger: "Route taxation-law course and registration questions to current TPB criteria."
  - id: "GS06"
    title: "TPB(GS) 06/2010: Professional indemnity insurance requirements"
    url: "https://www.tpb.gov.au/tpb-gs-06-2010-professional-indemnity-insurance-requirements-tax-bas-agents"
    trigger: "Flag service, technology or outsourcing changes that may affect required cover; a human confirms the policy."
  - id: "GS07"
    title: "TPB(GS) 07/2011: Claiming a lien over client property"
    url: "https://www.tpb.gov.au/tpb-gs-07-2011-claiming-lien-over-client-property"
    trigger: "Do not advise withholding client property without checking the engagement, law, ownership and professional duties."
  - id: "GS08"
    title: "TPB(GS) 08/2011: Practitioners acting as trustee: registration considerations"
    url: "https://www.tpb.gov.au/tpb-gs-08-2011-tax-practitioners-conducting-business-capacity-trustee-trust-registration-considerations"
    trigger: "Identify the practitioner’s capacity and whether services require registration."
  - id: "GS09"
    title: "TPB(GS) 09/2011: BAS agent educational qualification requirements"
    url: "https://www.tpb.gov.au/tpb-gs-09-2011-bas-agent-educational-qualification-requirements"
    trigger: "Use for BAS registration capability checks; do not state that a person qualifies without current TPB confirmation."
  - id: "GS10"
    title: "TPB(GS) 10/2011: Assessment requirements for an approved basic GST/BAS course"
    url: "https://www.tpb.gov.au/tpb-gs-10-2011-information-assessment-aspect-requirements-approved-course-basic-gst-bas-tax-principles"
    trigger: "Apply to approved-course assessment questions, not as a substitute for course-provider or TPB decisions."
  - id: "GS11"
    title: "TPB(GS) 11/2011: Mix-and-match educational qualification approach"
    url: "https://www.tpb.gov.au/tpb-gs-11-2011-educational-requirements-tax-practitioners-mix-match-approach-board-approved-courses"
    trigger: "Route mixed-qualification eligibility questions to current evidence and TPB criteria."
  - id: "GS12"
    title: "TPB(GS) 12/2011: Approval process for course providers"
    url: "https://www.tpb.gov.au/tpb-gs-12-2011-approval-process-course-providers"
    trigger: "Use for provider approval questions; do not imply that content or a provider is approved without verification."
  - id: "GS13"
    title: "TPB(GS) 13/2011: Reports or advice incorporating third-party tax agent services"
    url: "https://www.tpb.gov.au/tpb-gs-13-2011-reports-or-other-advice-incorporating-tax-agent-services-provided-third-party"
    trigger: "Identify who supplied each tax agent service, their registration/competence, scope and required review or disclosure."
  - id: "GS14"
    title: "TPB(GS) 14/2011: Digital service providers and the TASA"
    url: "https://www.tpb.gov.au/tpb-gs-14-2011-digital-service-providers-and-tax-agent-services-act-2009"
    trigger: "Test whether software or an AI-enabled service crosses into a tax agent service supplied for a fee or reward."
  - id: "GS15"
    title: "TPB(GS) 15/2011: Required knowledge of the TASA and Code"
    url: "https://www.tpb.gov.au/tpb-gs-15-2011-required-knowledge-tax-agent-services-act-2009-including-code"
    trigger: "Treat knowledge of current TASA/Code duties as a competence prerequisite."
  - id: "GS16"
    title: "TPB(GS) 16/2011: Challenge-test criteria for a basic GST/BAS course"
    url: "https://www.tpb.gov.au/tpb-gs-16-2011-challenge-test-criteria-basic-gst-bas-tax-principles"
    trigger: "Apply only to the relevant course/registration pathway and current evidence."
  - id: "GS17"
    title: "TPB(GS) 17/2012: Insolvency practitioners and registration"
    url: "https://www.tpb.gov.au/tpb-gs-17-2012-insolvency-practitioners-do-you-need-register-tax-or-bas-agent"
    trigger: "Classify the insolvency activity and check whether registration is required before providing services for reward."
  - id: "GS18"
    title: "TPB(GS) 18/2012: Contractors"
    url: "https://www.tpb.gov.au/tpb-gs-18-2012-contractors"
    trigger: "Establish who provides the service, whether the contractor is a third party, and the registration, permission and supervision controls."
  - id: "GS19"
    title: "TPB(GS) 19/2012: Non-accounting tertiary qualifications for tax agents"
    url: "https://www.tpb.gov.au/tpb-gs-19-2012-tertiary-qualifications-discipline-other-than-accounting-tax-agents"
    trigger: "Route non-accounting qualification claims to the current registration pathway and evidence."
  - id: "GS20"
    title: "TPB(GS) 20/2012: Holding money or other property on trust"
    url: "https://www.tpb.gov.au/tpb-gs-20-2012-holding-money-or-other-property-trust"
    trigger: "Require lawful custody, segregation, use, records and accounting; never let an LLM direct trust money."
  - id: "GS21"
    title: "TPB(GS) 21/2012: Valuers and tax-agent registration"
    url: "https://www.tpb.gov.au/tpb-gs-21-2012-do-valuers-need-register-tax-agents"
    trigger: "Classify whether the valuation work includes a tax agent service and check registration."
  - id: "GS22"
    title: "TPB(GS) 22/2013: Reasonable care to ascertain a client’s state of affairs"
    url: "https://www.tpb.gov.au/tpb-gs-22-2013-reasonable-care-ascertain-clients-state-affairs"
    trigger: "Obtain, reconcile and challenge the facts relevant to each statement or action for the client."
  - id: "GS23"
    title: "TPB(GS) 23/2013: Reasonable care to apply taxation laws correctly"
    url: "https://www.tpb.gov.au/tpb-gs-23-2013-reasonable-care-ensure-taxation-laws-are-applied-correctly"
    trigger: "Retrieve the authority operative for the relevant event and current duties today, apply it to established facts, and expose uncertainty and review."
  - id: "GS24"
    title: "TPB(GS) 24/2014: Managing conflicts of interest"
    url: "https://www.tpb.gov.au/tpb-gs-24-2014-managing-conflicts-interest"
    trigger: "Identify, evaluate, disclose/manage where permitted, or avoid the conflict; do not assume consent cures it."
  - id: "GS25"
    title: "TPB(GS) 25/2014: What is a tax (financial) advice service?"
    url: "https://www.tpb.gov.au/tpb-gs-25-2014-what-is-tax-financial-advice-service"
    trigger: "Classify the service and the registration/authorisation boundary before producing personal financial-product tax advice."
  - id: "GS26"
    title: "TPB(GS) 26/2014: Confidentiality of client information"
    url: "https://www.tpb.gov.au/tpb-gs-26-2014-confidentiality-client-information"
    trigger: "Confirm permission or legal duty before any third-party disclosure, including AI, cloud and outsourced processing."
  - id: "GS27"
    title: "TPB(GS) 27/2016: Labour hire/on-hire firms"
    url: "https://www.tpb.gov.au/tpb-gs-27-2016-labour-hire-on-hire-firms"
    trigger: "Identify the employment/service arrangement, registration responsibility and supervision."
  - id: "GS28"
    title: "TPB(GS) 28/2016: Lawful best interests for tax agents with a tax (financial) advice condition"
    url: "https://www.tpb.gov.au/tpb-gs-28-2016-acting-lawfully-best-interests-clients-tax-agents-tax-financial-advice-services-condition"
    trigger: "Apply lawful best-interests, scope and conflict controls when the condition and service are relevant."
  - id: "GS29"
    title: "TPB(GS) 29/2016: Payroll service providers"
    url: "https://www.tpb.gov.au/tpb-gs-29-2016-payroll-service-providers"
    trigger: "Classify payroll activities that are BAS/tax agent services and verify registration, competence and supervision."
  - id: "GS30"
    title: "TPB(GS) 30/2017: Cloud computing and the Code"
    url: "https://www.tpb.gov.au/tpb-gs-30-2017-cloud-computing-and-code-professional-conduct"
    trigger: "Check permission, data location, terms, security, access, backup, integrity, incidents, continuity and exit."
  - id: "GS31"
    title: "TPB(GS) 31/2018: Outsourcing and offshoring tax services"
    url: "https://www.tpb.gov.au/tpb-gs-31-2018-outsourcing-and-offshoring-tax-services-code-professional-conduct-considerations"
    trigger: "Confirm client permission, accurate disclosure, provider controls, competence, supervision, data handling and PI cover."
  - id: "GS32"
    title: "TPB(GS) 32/2018: Recognised professional associations: corporate governance"
    url: "https://www.tpb.gov.au/tpb-gs-32-2018-recognised-professional-associations-corporate-governance-related-requirements-recognition"
    trigger: "Apply to association recognition/governance questions; do not infer recognition."
  - id: "GS33"
    title: "TPB(GS) 33/2018: Complying with tax laws in personal affairs"
    url: "https://www.tpb.gov.au/tpb-gs-33-2018-complying-taxation-laws-conduct-your-personal-affairs"
    trigger: "Flag practitioner, associated-entity and practice obligations relevant to Code item 2 for human action."
  - id: "GS34"
    title: "TPB(GS) 34/2019: Letters of engagement"
    url: "https://www.tpb.gov.au/tpb-gs-34-2019-letters-engagement"
    trigger: "Establish scope, responsibilities, fees, limitations, records, third-party/AI use, client permission and changes in writing."
  - id: "GS35"
    title: "TPB(GS) 35/2020: Recognised associations: TPB discretion"
    url: "https://www.tpb.gov.au/tpb-gs-35-2020-recognised-professional-associations-tpb-discretion-specific-requirements-recognition"
    trigger: "Apply only to current association-recognition discretion; the LLM cannot exercise the TPB’s discretion."
  - id: "GS36"
    title: "TPB(GS) 36/2021: Client TFNs in email"
    url: "https://www.tpb.gov.au/tpb-gs-36-2021-use-and-disclosure-clients-tfn-and-tfn-information-email"
    trigger: "Minimise TFNs and apply TFN, privacy, permission and secure-transmission controls before email or tool use."
  - id: "GS37"
    title: "TPB(GS) 37/2021: CPE for tax and BAS agents"
    url: "https://www.tpb.gov.au/tpb-gs-37-2021-cpe-requirements-tax-and-bas-agents"
    trigger: "Flag CPE and recordkeeping requirements; model use alone does not establish eligible CPE or competence, so verify the activity and evidence."
  - id: "GS38"
    title: "TPB(GS) 38/2022: CPE for tax agents with a tax (financial) advice condition"
    url: "https://www.tpb.gov.au/tpb-gs-38-2022-cpe-requirements-tax-agents-tax-financial-advice-services-condition"
    trigger: "Apply when that registration condition is relevant and check current CPE evidence."
  - id: "GS39"
    title: "TPB(GS) 39/2022: Australian taxation-law course for conditioned tax agents"
    url: "https://www.tpb.gov.au/tpb-gs-39-2022-course-australian-taxation-law-approved-board-tax-agents-tax-financial-advice-services-condition"
    trigger: "Route conditioned-registration course questions to current TPB criteria."
  - id: "GS40"
    title: "TPB(GS) 40/2022: Commercial-law course for conditioned tax agents"
    url: "https://www.tpb.gov.au/tpb-gs-40-2022-course-commercial-law-approved-board-tax-agents-tax-financial-advice-services-condition"
    trigger: "Route conditioned-registration course questions to current TPB criteria."
  - id: "GS41"
    title: "TPB(GS) 41/2022: Relevant tax (financial) advice experience"
    url: "https://www.tpb.gov.au/tpb-gs-41-2022-relevant-tax-financial-advice-experience-tax-agents-tfa-services-condition"
    trigger: "Do not claim relevant experience without evidence and current TPB assessment criteria."
  - id: "GS42"
    title: "TPB(GS) 42/2022: Proof-of-identity requirements for client verification"
    url: "https://www.tpb.gov.au/tpb-gs-42-2022-proof-identity-requirements-client-verification"
    trigger: "Use current identity controls, minimise retained evidence and require human resolution of mismatches or fraud indicators."
  - id: "GS43"
    title: "TPB(GS) 43/2023: What is a BAS service?"
    url: "https://www.tpb.gov.au/tpb-gs-43-2023-what-is-bas-service"
    trigger: "Classify the activity, reliance and reward under the applicable TASA s 90-10. The 10 September 2026 update explains additional services historically covered by the repealed 2020 instrument."
  - id: "GS44"
    title: "TPB(GS) 44/2023: What is a tax agent service?"
    url: "https://www.tpb.gov.au/tpb-gs-44-2023-what-is-tax-agent-service"
    trigger: "Classify the activity, reliance and reward before deciding the registration boundary."
  - id: "GS45"
    title: "TPB(GS) 45/2023: What is a fee or other reward?"
    url: "https://www.tpb.gov.au/tpb-gs-45-2023-what-is-fee-or-other-reward"
    trigger: "Consider direct, indirect and non-cash benefit when testing the registration boundary."
  - id: "GS46"
    title: "TPB(GS) 46/2024: Using a disqualified entity without approval"
    url: "https://www.tpb.gov.au/tpb-gs-46-2024-employing-or-using-disqualified-entity-provision-tax-agent-services-without-approval"
    trigger: "Check status and written TPB approval before allocating tax agent services."
  - id: "GS47"
    title: "TPB(GS) 47/2024: Arrangements with a disqualified entity"
    url: "https://www.tpb.gov.au/tpb-gs-47-2024-prohibition-providing-tax-agent-services-connection-arrangement-disqualified-entity"
    trigger: "Stop a connected arrangement when disqualification is known or reasonably suspected and seek authorised review."
  - id: "GS48"
    title: "TPB(GS) 48/2024: Breach reporting under the TASA"
    url: "https://www.tpb.gov.au/tpb-gs-48-2024-breach-reporting-under-tax-agent-services-act-2009"
    trigger: "Flag the possible 30-day clock under ss 30-35 or 30-40, record when reasonable grounds existed or ought to have existed, identify possible recipients and refer the statutory tests and reporting to an authorised practitioner."
  - id: "GS49"
    title: "TPB(GS) 49/2024: Upholding ethical standards of the tax profession"
    url: "https://www.tpb.gov.au/tpb-gs-49-2024-upholding-and-promoting-ethical-standards-tax-profession"
    trigger: "Test conduct and communications against public trust, integrity and professional behaviour."
  - id: "GS50"
    title: "TPB(GS) 50/2024: False or misleading statements"
    url: "https://www.tpb.gov.au/tpb-gs-50-2024-false-or-misleading-statements"
    trigger: "Apply the full s 15 scope and each applicable correction, client-advice, withdrawal, notification and public-interest branch; an authorised practitioner determines the tests and acts."
  - id: "GS51"
    title: "TPB(GS) 51/2024: Government conflicts and confidentiality"
    url: "https://www.tpb.gov.au/tpb-gs-51-2024-managing-conflicts-interest-when-undertaking-activities-government-and-maintaining-confidentiality-dealings-government"
    trigger: "Use information barriers and conflict review; never repurpose confidential government information for clients."
  - id: "GS52"
    title: "TPB(GS) 52/2024: Proper client records"
    url: "https://www.tpb.gov.au/tpb-gs-52-2024-obligation-keep-proper-client-records-tax-agent-services-provided"
    trigger: "Record scope, outcome, relevant information, advice, facts, assumptions, reasoning, review and required retention."
  - id: "GS53"
    title: "TPB(GS) 53/2024: Supervision, competency and quality management"
    url: "https://www.tpb.gov.au/tpb-gs-53-2024-supervision-competency-and-quality-management-under-tax-agent-services-act-2009"
    trigger: "Require competent people, proportionate supervision, documented review and an enforced quality-management system."
  - id: "GS54"
    title: "TPB(GS) 54/2024: Keeping clients informed"
    url: "https://www.tpb.gov.au/tpb-gs-54-2024-keeping-your-clients-informed"
    trigger: "Identify required client information, timing and presentation; make material matters prominent and unambiguous."
  - id: "GS55"
    title: "TPB(GS) 55/2026: Artificial Intelligence and the Code"
    url: "https://www.tpb.gov.au/tpbgs-552026-use-artificial-intelligence-and-code-professional-conduct"
    trigger: "Apply to every AI-assisted tax agent service: human accountability, verification, judgement, documentation, privacy and tool due diligence; obtain client permission where entering information into the configured tool discloses it to a third party unless there is a legal duty to disclose."
