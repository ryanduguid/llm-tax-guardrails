# Concordance between TPB(GS) 55/2026 "The use of Artificial Intelligence and the
# Code of Professional Conduct", the National AI Centre's essential practices and
# the DrDebits controls that apply them. Paragraph numbers are the Guidance
# Statement's own. Every value is one line with no pipe character, because the
# builder renders these rows as Markdown tables. Add rows in ascending id order
# and keep each section's rows together.
issued: "2026-07-22"
checked: "2026-09-27"
sections:
  - "General considerations (paragraphs 4 to 11)"
  - "Competency (paragraphs 12 to 18)"
  - "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
  - "Further information the Guidance Statement lists (paragraph 32)"
  - "National AI Centre essential practices"
entries:
  - id: "CC-01"
    section: "General considerations (paragraphs 4 to 11)"
    source: "Paragraphs 4 to 6"
    consideration: "AI includes features embedded in software and third-party platforms, and functionality that operates autonomously and may take actions on behalf of the user."
    control: "Deployment, integrity and authority (tools default to read-only; the state-change gate); Trust boundary and instruction integrity."
    note: "The gate treats an embedded feature and an autonomous agent alike: every state change waits for the exact action to be presented and approved."
  - id: "CC-02"
    section: "General considerations (paragraphs 4 to 11)"
    source: "Paragraph 8"
    consideration: "The practitioner remains responsible for the service; understand the tool's capabilities and limitations, and assess and supplement AI output with professional judgement before relying on it."
    control: "Operating role and responsibility; AI-specific TPB rules, first three bases."
    note: "None."
  - id: "CC-03"
    section: "General considerations (paragraphs 4 to 11)"
    source: "Paragraph 9"
    consideration: "Factors to weigh: the nature of the activity, how and where information is stored and used, the extent of reliance on the output, the tool's abilities and limitations, the review process before use, and the appropriateness of the tool, its inputs and the decisions made while using it."
    control: "AI-specific TPB rules (capabilities, limitations, data inputs, storage, expected use and degree of reliance); Risk classification; reference/ai-vendor-assurance.md rows on storage, access and retention."
    note: "Record the answers in the quality-management system, not in a prompt."
  - id: "CC-04"
    section: "General considerations (paragraphs 4 to 11)"
    source: "Paragraph 10"
    consideration: "APES 110 clarifies the expected behaviours of members using technology, though it does not bind every practitioner."
    control: "APES 110 control set, Technology and AI; Authority and conflicts (which standard binds whom)."
    note: "None."
  - id: "CC-05"
    section: "General considerations (paragraphs 4 to 11)"
    source: "Paragraph 11"
    consideration: "Recognised professional associations may publish further guidance on the general considerations."
    control: "Intake gate, people and capacity; Source status (the APESB Technical Alert row)."
    note: "Check the responsible person's association guidance at intake; DrDebits cites APESB material only."
  - id: "CC-06"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraphs 12 and 13, Code items 7 and 8"
    consideration: "Services must be provided competently and knowledge and skills kept current, whether or not AI is used."
    control: "TPB control set items 7 and 8; Mandatory workflow (verify all material LLM work before reliance)."
    note: "None."
  - id: "CC-07"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraph 13, Code items 9 and 10"
    consideration: "Take reasonable care to ascertain the client's state of affairs and to apply the taxation laws correctly."
    control: "TPB control set items 9 and 10; Intake gate; Mandatory workflow steps on facts and law."
    note: "AI output never establishes a fact; the intake gate collects and labels facts for the human."
  - id: "CC-08"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraph 13, Determination s 30"
    consideration: "Keep records that correctly record the services provided to each client, including former clients."
    control: "Code Determination s 30 row; Workpaper record."
    note: "None."
  - id: "CC-09"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraph 13, Determination s 35"
    consideration: "Every entity providing services on the practitioner's behalf must maintain relevant knowledge and skills and be appropriately supervised under the system of quality management."
    control: "Code Determination s 35 row (an LLM is not a substitute for supervision); APES 110 control set, supervise and review AI-assisted work."
    note: "None."
  - id: "CC-10"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraph 13, Determination s 40"
    consideration: "Establish, document and enforce a system of quality management that gives reasonable confidence of Code compliance."
    control: "Code Determination s 40 row; Deployment, integrity and authority (the host acceptance record)."
    note: "None."
  - id: "CC-11"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraphs 14 and 15"
    consideration: "Large language models can be hard to interpret and can be biased; exercise professional judgement and do not rely on AI output as a substitute for analysing the client's circumstances."
    control: "AI-specific TPB rules (client circumstances analysed by the practitioner); Output contract (facts, assumptions and uncertainty labelled)."
    note: "None."
  - id: "CC-12"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraph 16"
    consideration: "AI can hallucinate; verify and review AI content for accuracy at each step of the workflow, keep a process for understanding and contesting AI outputs, and document each step so that Determination ss 30 and 40 are met."
    control: "AI-specific TPB rules (verification throughout the workflow, a contest process and its record); Mandatory workflow; Workpaper record."
    note: "The Mandatory workflow's verification, challenge and workpaper steps are the contest process for each task's output; the behaviour tests evaluate a deployment and contest nothing."
  - id: "CC-13"
    section: "Competency (paragraphs 12 to 18)"
    source: "Paragraphs 17 and 18"
    consideration: "Reasonable care depends on the circumstances: the nature and scope of the service, whether output was checked before reliance, and whether AI was used for tasks that should be independently verified, particularly outside the practitioner's expertise. The standard is the competent, reasonable practitioner."
    control: "Risk classification; Mandatory workflow (independent reperformance or a second method for high-impact work); Non-negotiable stops."
    note: "None."
  - id: "CC-14"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraphs 19 to 22, Code item 6"
    consideration: "Information relating to a client's affairs must not be disclosed to a third party without permission unless a legal duty applies; a third party is any entity other than the client and the practitioner, and the information need not have come from the client."
    control: "TPB control set item 6; Data and privacy gate."
    note: "Entering client information into an AI tool can be a disclosure, depending on how the tool is configured and used."
  - id: "CC-15"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraph 23"
    consideration: "Obtain each client's permission before client information goes into an AI tool that discloses it to a third party, and tell the client to whom and where the disclosure is made, where data is stored and whether AI tools may be used."
    control: "AI-specific TPB rules (permission and explanation); Data and privacy gate."
    note: "None."
  - id: "CC-16"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraph 24"
    consideration: "Permission may be given by a signed letter of engagement, a signed consent, a fact-find consent or a general authority to disclose to third parties."
    control: "AI-specific TPB rules (the permission forms the Guidance Statement accepts)."
    note: "Added with this concordance. The record of which form applies belongs in the engagement file."
  - id: "CC-17"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraph 25"
    consideration: "The practitioner exercises due diligence over commercial and in-house AI tools so that information stays secure and Privacy Act requirements are met."
    control: "AI-specific TPB rules (due diligence); reference/ai-vendor-assurance.md."
    note: "None."
  - id: "CC-18"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraph 26"
    consideration: "Where TFNs are involved, the Privacy (Tax File Number) Rule 2015 may add obligations; practitioners seek their own advice."
    control: "AI-specific TPB rules (Privacy Act, Australian Privacy Principles and the TFN Rule); Non-negotiable stops (never expose a TFN)."
    note: "None."
  - id: "CC-19"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraph 27"
    consideration: "Further TPB products on third parties, permission, legal duty and outsourcing: TPB(GS) 26/2014 and TPB(GS) 31/2018."
    control: "reference/tpb-catalogue.md rows GS26 and GS31."
    note: "None."
  - id: "CC-20"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraphs 28 and 29"
    consideration: "The other Code obligations, including honesty and integrity, independence and other responsibilities, continue to apply when AI is used."
    control: "TPB control set items 1 to 17; APES 110 control set."
    note: "None."
  - id: "CC-21"
    section: "Confidentiality, privacy and the other Code obligations (paragraphs 19 to 31)"
    source: "Paragraphs 30 and 31"
    consideration: "The Privacy Act and the Australian Privacy Principles govern the use, storage and disclosure of personal information and can bear on client consent; the OAIC publishes the guidance."
    control: "Data and privacy gate; AI-specific TPB rules (Privacy Act)."
    note: "None."
  - id: "CC-22"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "TPB(GS) 26/2014 Confidentiality of client information"
    consideration: "Code item 6 in depth."
    control: "reference/tpb-catalogue.md row GS26."
    note: "None."
  - id: "CC-23"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "TPB(GS) 36/2021 Use and disclosure of a client's TFN and TFN information in email communications"
    consideration: "Using and disclosing TFN information."
    control: "reference/tpb-catalogue.md row GS36; Non-negotiable stops."
    note: "None."
  - id: "CC-24"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "TPB(GS) 22/2013 and TPB(GS) 23/2013"
    consideration: "Reasonable care to ascertain a client's state of affairs and to apply the taxation laws correctly."
    control: "reference/tpb-catalogue.md rows GS22 and GS23; TPB control set items 9 and 10."
    note: "None."
  - id: "CC-25"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "TPB(GS) 14/2011 Digital service providers and the Tax Agent Services Act 2009"
    consideration: "How the tax agent services regime operates for providers of tax-related software."
    control: "reference/tpb-catalogue.md row GS14."
    note: "Relevant where the AI product itself provides a tax agent service."
  - id: "CC-26"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "TPB(GS) 31/2018 Outsourcing and offshoring of tax services"
    consideration: "Code considerations for outsourcing and offshoring, which a hosted AI service can resemble."
    control: "reference/tpb-catalogue.md row GS31; reference/ai-vendor-assurance.md (location and subcontractors)."
    note: "None."
  - id: "CC-27"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "TPB(GS) 01/2010, TPB(GS) 02/2010 and the TPB webpage on failing to comply with your obligations"
    consideration: "The Code explained, fitness and propriety, and the consequences of non-compliance."
    control: "reference/tpb-catalogue.md rows GS01 and GS02; TPB sanctions from 1 October 2026."
    note: "None."
  - id: "CC-28"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "APESB technology-related revisions to the Code, and the APESB Technical Alert on the ethical use of artificial intelligence"
    consideration: "Expected behaviours of members using technology and AI."
    control: "APES 110 control set, Technology and AI; Source status."
    note: "None."
  - id: "CC-29"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "Department of Industry, Science and Resources: Voluntary AI Safety Standard and Australia's AI Ethics Principles"
    consideration: "Organisation-level guidance on safe and responsible use of AI."
    control: "reference/ai-vendor-assurance.md; the essential-practice rows below."
    note: "The Guidance Statement lists both alongside the National AI Centre's essential practices; the rows below follow the essential practices."
  - id: "CC-30"
    section: "Further information the Guidance Statement lists (paragraph 32)"
    source: "National AI Centre: Essential AI practices"
    consideration: "The Australian Government's guidance for responsible AI use: governance, oversight and transparency."
    control: "Rows CC-31 to CC-36."
    note: "None."
  - id: "CC-31"
    section: "National AI Centre essential practices"
    source: "Practice 1, decide who is accountable"
    consideration: "Assign and document who is accountable for AI policy, for each system's deployment and human oversight, for testing, and for concerns and redress."
    control: "Operating role and responsibility (the professional decision owner); Code Determination s 40 row (the documented quality-management system)."
    note: "No guide control names owners for AI policy, testing, concerns or redress, and the host acceptance record captures a test operator only; the firm records those owners in its quality-management system."
  - id: "CC-32"
    section: "National AI Centre essential practices"
    source: "Practice 2, understand impacts and plan accordingly"
    consideration: "Document each system's scope, intended use, foreseeable misuse, capabilities and limitations, and who could be harmed."
    control: "Risk classification; Intake gate; Data and privacy gate."
    note: "None."
  - id: "CC-33"
    section: "National AI Centre essential practices"
    source: "Practice 3, measure and manage risks"
    consideration: "AI-specific risk management across the supply chain of model developers, system developers and deployers."
    control: "Risk classification; AI-specific TPB rules (due diligence); reference/ai-vendor-assurance.md."
    note: "None."
  - id: "CC-34"
    section: "National AI Centre essential practices"
    source: "Practice 4, share essential information"
    consideration: "Tell affected people what the AI does, its limits and how to raise a concern or contest an outcome."
    control: "Output contract (limits and status on every draft); AI-specific TPB rules (explain AI use to the client)."
    note: "No guide control gives an affected person a route to contest an AI outcome, and the Code Determination s 45 row requires disclosure of a complaint process rather than any such route: this part of the practice is uncovered, and the firm decides how its own complaint process treats AI outcomes."
  - id: "CC-35"
    section: "National AI Centre essential practices"
    source: "Practice 5, test and monitor"
    consideration: "Test before deployment and monitor in use, keeping records of testing and incidents."
    control: "tests/behaviour-tests.md (the cases a deployment is expected to pass) and evals/RESULTS.md (recorded runs, which certify nothing); Mandatory workflow checks for each task; Source status monitoring (source currency only)."
    note: "No guide control records in-use monitoring or AI incidents; a recorded evaluation run is evidence of that run, not of testing before this deployment, so the firm keeps both records in its quality-management system."
  - id: "CC-36"
    section: "National AI Centre essential practices"
    source: "Practice 6, maintain human control"
    consideration: "People can intervene, override and stop the system, and consequential decisions stay with them."
    control: "Non-negotiable stops; Deployment, integrity and authority (the state-change gate); Operating role and responsibility."
    note: "None."
