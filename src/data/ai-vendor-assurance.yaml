sections:
  - "Authority and accountability"
  - "Confidentiality, privacy and data handling"
  - "Grounding, sources and calculation"
  - "Human review and supervision"
  - "Records, evidence and disclosure"
  - "Security, access and change"
  - "Continuity, incidents and exit"
  - "Conflicts, independence and inducements"
entries:
  - id: "VA-01"
    section: "Authority and accountability"
    question: "Which actions can the product take without a person approving that specific action, and which require approval each time?"
    evidence: "A written inventory separating read-only retrieval from every write, send, lodgement, payment and deletion, naming the approval step for each."
    obligation: "DrDebits Deployment, integrity and authority (state-change gate); Code Determination s 35 (competence and supervision); TPB(GS) 55/2026 (expected use and degree of reliance)."
    if_absent: "Treat every action as unapproved and keep the product away from any system that can write, send or lodge."
  - id: "VA-02"
    section: "Authority and accountability"
    question: "How does the product establish that the person approving an action holds authority for it?"
    evidence: "Identity, role and engagement authority verified by the host system outside prompt text, with a record of who approved what."
    obligation: "DrDebits `AUTHORISED_HUMAN` definition; Code Determination s 40 (quality management); TASA Code item 7 (competent service)."
    if_absent: "The product is inferring authority from a login or from a claim typed into a chat, so its approvals carry no weight."
  - id: "VA-03"
    section: "Authority and accountability"
    question: "Which outputs does the product describe as reviewed, checked, approved or compliant, and what does a person actually do before that label appears?"
    evidence: "Product copy, in-product labels and report footers read against the workflow that produces them."
    obligation: "TASA Code item 1 (honesty and integrity); APES 110 integrity `R111.1 to R111.3`; APESB Technical Alert 31 October 2025 (do not present a tool as reviewer or approver)."
    if_absent: "Unreviewed output may be reaching clients under a reviewed label. Change the label before the next file goes out."
  - id: "VA-04"
    section: "Authority and accountability"
    question: "Who carries a wrong figure the product produces, and what do the vendor contract and the practice indemnity policy say about it?"
    evidence: "Liability, limitation and indemnity terms read alongside the current professional indemnity policy and any technology exclusion."
    obligation: "TASA Code item 13 (professional indemnity insurance); item 7 (competent service)."
    if_absent: "Assume the practitioner carries it, and confirm cover for the proposed use before client work reaches the product."
  - id: "VA-05"
    section: "Confidentiality, privacy and data handling"
    question: "Which organisations receive client information when the product runs, counting model providers, hosting, support and subprocessors?"
    evidence: "A current subprocessor list naming each recipient, its role and its location, with a commitment to notify changes."
    obligation: "TASA Code item 6 (confidentiality); TPB(GS) 55/2026 (subcontractors, location); APES 110 `R114.1`, `R114.2`, `AUST R114.3`, `R114.4`; Privacy Act 1988 and the Australian Privacy Principles."
    if_absent: "No client can give informed permission, because nobody can say who receives their information."
  - id: "VA-06"
    section: "Confidentiality, privacy and data handling"
    question: "In which countries is client information processed and stored, counting backups, logs and support access?"
    evidence: "Named regions per data store, plus the locations from which support staff can view client content."
    obligation: "TPB(GS) 55/2026 (storage location, access); Privacy Act 1988 and the Australian Privacy Principles; TASA Code item 6."
    if_absent: "Record the location as unknown. Cross-border disclosure cannot be assessed, so it cannot be permitted."
  - id: "VA-07"
    section: "Confidentiality, privacy and data handling"
    question: "Is client information, prompt text or output used to train, fine-tune, evaluate, benchmark or improve any model, by the vendor or by a subprocessor?"
    evidence: "A contract term covering the vendor and every subprocessor, rather than a settings toggle or a sentence on a web page."
    obligation: "TASA Code item 6 (confidentiality); APES 110 confidentiality across the complete data lifecycle; TPB(GS) 55/2026 (training use)."
    if_absent: "Treat everything sent to the product as disclosed for a purpose the firm has not agreed to."
  - id: "VA-08"
    section: "Confidentiality, privacy and data handling"
    question: "How does the product keep TFNs and other identifiers the task does not need out of prompts, logs, caches and exports?"
    evidence: "Field-level handling documented at each of those points, with the redaction step named and observed on a test file."
    obligation: "Privacy (Tax File Number) Rule 2015; DrDebits Data and privacy gate; the non-negotiable stop on exposing a TFN."
    if_absent: "Assume TFNs reach the logs, and keep them out of the product until the handling is shown."
  - id: "VA-09"
    section: "Confidentiality, privacy and data handling"
    question: "How long does client information persist in prompts, logs, caches, embeddings and backups, and how is deletion evidenced?"
    evidence: "A retention period per store and a deletion record the firm can produce later, covering derived stores as well as uploaded files."
    obligation: "TPB(GS) 55/2026 (retention); Code Determination s 30 (records the practitioner must keep for at least five years); the Australian Privacy Principles (information the firm must not hold longer than it needs)."
    if_absent: "The firm can neither prove deletion nor produce the record it is required to hold."
  - id: "VA-10"
    section: "Confidentiality, privacy and data handling"
    question: "Can one client’s information be identified, exported and destroyed on request, including from derived stores?"
    evidence: "A demonstrated single-client export and deletion on a test tenancy."
    obligation: "Privacy Act 1988 and the Australian Privacy Principles; TPB(GS) 55/2026 (exit arrangements); TASA Code item 6."
    if_absent: "A request the firm is obliged to answer has no answer."
  - id: "VA-11"
    section: "Confidentiality, privacy and data handling"
    question: "What must the firm tell a client before their information is entered, and does the vendor support that disclosure?"
    evidence: "Wording naming the recipient, the processing and storage locations and the AI use, in terms the client can act on."
    obligation: "TPB(GS) 55/2026 (client permission unless a legal duty to disclose applies, with the recipient, location and AI use explained); TASA Code item 6."
    if_absent: "Permission obtained without those facts is not informed permission, so hold the client information back."
  - id: "VA-12"
    section: "Grounding, sources and calculation"
    question: "Where do the rates, thresholds, dates and labels in the output come from, and who updates them?"
    evidence: "A named source per figure with a check date and a documented update process, rather than a model recollection."
    obligation: "TASA Code items 8 and 10 (current knowledge and skills; correct application of the tax law); DrDebits Source status and authority."
    if_absent: "Treat every figure as unverified and check it at the primary source before use."
  - id: "VA-13"
    section: "Grounding, sources and calculation"
    question: "Which monetary and statutory figures does the product compute in code, and which does the model generate?"
    evidence: "A field-by-field statement, plus a sample the firm reperforms independently."
    obligation: "DrDebits Mandatory workflow (deterministic computation preferred over generated arithmetic); APES 110 reliance on technology output `R220.8`, `220.8 A1`; `R320.11`, `320.11 A1`."
    if_absent: "Reperform every figure. Fluent presentation is not evidence of arithmetic."
  - id: "VA-14"
    section: "Grounding, sources and calculation"
    question: "What does the product do when a material fact is missing or a source cannot be verified?"
    evidence: "Two runs the firm performs itself: one file with a missing fact, one with an unreachable source. A product that answers anyway is the finding."
    obligation: "DrDebits decision statuses `NEEDS_FACTS` and `ESCALATE`; the `SOURCE CURRENCY NOT CONFIRMED` label."
    if_absent: "Assume the product fills the gap and presents the result as settled."
  - id: "VA-15"
    section: "Grounding, sources and calculation"
    question: "Can a reviewer see the sources behind one specific figure, at the point of that figure?"
    evidence: "A citation per material assertion that resolves to a retrievable primary source, checked on a live file rather than a demonstration."
    obligation: "DrDebits Mandatory workflow (primary-source grounding); TPB(GS) 55/2026 (verify AI content throughout the workflow)."
    if_absent: "The output cannot be verified, so it cannot support a client deliverable."
  - id: "VA-16"
    section: "Grounding, sources and calculation"
    question: "How does the product treat instructions that appear inside client documents, emails and tool responses?"
    evidence: "A documented trust boundary and an observed run on a document carrying an embedded instruction."
    obligation: "DrDebits Trust boundary and instruction integrity; behaviour tests INJ-001 and INJ-002."
    if_absent: "Assume a client document can redirect the product, and give it no tools that act."
  - id: "VA-17"
    section: "Human review and supervision"
    question: "Which review step is mandatory before output reaches a client, and can a user or an administrator switch it off?"
    evidence: "The configuration that enforces it and the record of who reviewed each item."
    obligation: "Code Determination s 35 (competence and supervision); TPB(GS) 55/2026 (AI output assessed and supplemented by professional judgement)."
    if_absent: "Treat the review step as optional in practice and impose the firm’s own control instead."
  - id: "VA-18"
    section: "Human review and supervision"
    question: "What does a reviewer see: the output alone, or the inputs, sources, assumptions and every change the product made?"
    evidence: "A worked example of the review view on a file of realistic size and untidiness."
    obligation: "APES 110 competence, due care and supervision `R113.1 to R113.3`; the conceptual framework requirement to document significant judgements."
    if_absent: "The reviewer is approving a conclusion they have no means to test."
  - id: "VA-19"
    section: "Human review and supervision"
    question: "How does the product report what it could not resolve, rather than resolving it?"
    evidence: "An exceptions or client-query list produced on a test file, with the unresolved items visible to the reviewer."
    obligation: "DrDebits Output contract; APES 110 integrity (disclose relevant limitations)."
    if_absent: "Silence is being presented as completeness."
  - id: "VA-20"
    section: "Human review and supervision"
    question: "What capacity or turnaround does the vendor claim, and how much review time per item does that claim assume?"
    evidence: "The claim, the review time it assumes, and the firm’s measured review time on a sample of its own files."
    obligation: "APES 110 objectivity and undue influence `R112.1 to R112.2`; inducements and pressure sections 250, 270 and 340; APESB Technical Alert 31 October 2025 (avoid undue reliance on technology)."
    if_absent: "A capacity figure that leaves no room for review is a proposal to shorten review. Cost the review time before the firm commits to the figure."
  - id: "VA-21"
    section: "Records, evidence and disclosure"
    question: "What record does the product produce of AI use on a file: inputs, sources, checks, changes and the reviewer?"
    evidence: "The record it emits on a test file, in a form the firm’s quality-management system can hold."
    obligation: "Code Determination s 30 (proper client records); DrDebits Workpaper record; TPB(GS) 55/2026 (document the review and any challenged or changed output)."
    if_absent: "The firm cannot show a reviewer or a regulator what the model contributed."
  - id: "VA-22"
    section: "Records, evidence and disclosure"
    question: "Can the firm reproduce an output from six months ago, with the model version and the sources that produced it?"
    evidence: "Version pinning, retained inputs and a reproduction run on an archived file."
    obligation: "Code Determination s 30 (records retained for at least five years); s 40 (quality management)."
    if_absent: "Last year’s workpaper cannot be defended this year."
  - id: "VA-23"
    section: "Records, evidence and disclosure"
    question: "How is AI use disclosed to the client, and who controls the wording?"
    evidence: "The disclosure text, where it appears in the deliverable, and the firm’s ability to change it."
    obligation: "APESB Technical Alert 31 October 2025 (disclose AI use, supervise and review); law, engagement terms or a service-specific APES standard where disclosure is mandatory; Code Determination s 45 (keeping clients informed)."
    if_absent: "The firm is disclosing on the vendor’s terms, or not at all."
  - id: "VA-24"
    section: "Security, access and change"
    question: "Who at the vendor can read client information, under what approval, and where is that access logged?"
    evidence: "The access model, the approval path for support access, and a log the firm can request for a named period."
    obligation: "TPB(GS) 55/2026 (access, security); Privacy Act 1988 and the Australian Privacy Principles; TASA Code item 6."
    if_absent: "Assume support staff can open any file the firm uploads."
  - id: "VA-25"
    section: "Security, access and change"
    question: "What independent assurance covers this product, what period does it cover, and what did the assessor leave out of scope?"
    evidence: "The report or attestation with its scope section, obtained under a confidentiality agreement where needed. A partner tier, a certification badge and a security web page are not the report."
    obligation: "TPB(GS) 55/2026 (due diligence over confidentiality, security and access); Code Determination s 40 (quality management)."
    if_absent: "Record the product as carrying no independent assurance. A partner badge attests to a commercial relationship, not to how this product handles client data."
  - id: "VA-26"
    section: "Security, access and change"
    question: "How is the firm told when the model, the prompts or the product behaviour change?"
    evidence: "A change-notice channel, a version identifier visible in the product, and the notices issued over the last twelve months."
    obligation: "TPB(GS) 55/2026 (understand the tool’s capabilities and limitations); APES 110 conceptual framework (re-evaluate when tool behaviour changes)."
    if_absent: "The product the firm tested is not the product it is running today."
  - id: "VA-27"
    section: "Security, access and change"
    question: "Can the firm test a change before it reaches client work?"
    evidence: "A staging environment or an opt-in window, with the firm’s own regression cases run against it."
    obligation: "Code Determination s 40 (quality management); APES 110 competence, due care and supervision `R113.1 to R113.3`."
    if_absent: "Every change lands on live client files first, and the firm finds out from the output."
  - id: "VA-28"
    section: "Continuity, incidents and exit"
    question: "What happens when client information is exposed, and how quickly is the firm told?"
    evidence: "The notification commitment in hours, the contact path, and what the vendor supplies for the firm’s own assessment."
    obligation: "TPB(GS) 55/2026 (incident response); the breach-notification obligations in the Privacy Act 1988, retrieved at their current text; DrDebits Data and privacy gate."
    if_absent: "The firm hears about its own breach from the client, or not at all."
  - id: "VA-29"
    section: "Continuity, incidents and exit"
    question: "If the vendor fails, is acquired or retires the product, what happens to client information and to work in progress?"
    evidence: "Exit terms covering export format, assistance period, deletion certification and the obligations that survive termination."
    obligation: "TPB(GS) 55/2026 (exit arrangements); Code Determination s 30 (records the practitioner must still hold)."
    if_absent: "The firm’s client records depend on the vendor staying solvent and interested."
  - id: "VA-30"
    section: "Continuity, incidents and exit"
    question: "What work stops if the product is unavailable during a lodgement period, and what is the fallback?"
    evidence: "A fallback the firm has run once at deadline volume, not a described one."
    obligation: "TASA Code item 7 (competent service); item 12 (client rights, obligations, deadlines and consequences within the engagement scope)."
    if_absent: "The lodgement timetable now depends on the vendor’s uptime."
  - id: "VA-31"
    section: "Conflicts, independence and inducements"
    question: "Do the vendor, its investors or its partners hold a relationship with a client, a referral source or a competitor of the firm?"
    evidence: "Ownership, investor and partnership disclosures, checked against the client and referral lists."
    obligation: "TASA Code item 5 (conflicts); APES 110 conflicts sections 210 and 310."
    if_absent: "A conflict nobody has identified cannot be managed or disclosed."
  - id: "VA-32"
    section: "Conflicts, independence and inducements"
    question: "On an assurance engagement, does the product decide anything, or does it only propose?"
    evidence: "The specific outputs it produces on that engagement, referred to the engagement partner before any use."
    obligation: "APES 110 Parts 4A and 4B; DrDebits Independence and assurance; behaviour tests IND-001 and ACT-001."
    if_absent: "Keep the product off that engagement until the engagement partner has decided."
  - id: "VA-33"
    section: "Conflicts, independence and inducements"
    question: "What commercial incentives attach to volume, to referrals or to the firm promoting the product?"
    evidence: "Fee structure, rebates, referral terms and any marketing obligation in the contract."
    obligation: "APES 110 inducements and pressure sections 250, 270 and 340; TASA Code item 4 (the client’s lawful best interests)."
    if_absent: "An incentive the firm has not written down is one it cannot weigh against the client’s interests."
