# Local gates, matching .github/workflows/verify.yml.
#
# Every hook below runs the same command the workflow runs, through the
# toolchain pinned in rust-toolchain.toml and the locked dependencies, so a
# hook that passes here cannot fail there on a version difference. `cargo`
# must be on PATH; rustup installs the pinned toolchain on first use.
#
# The build parity check matters most locally: CI rejects a hand edit to a
# generated file, and finding that out after a push means rewriting the commit.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: rustfmt
        name: format the builder
        entry: cargo fmt --manifest-path tools/drdebits_build/Cargo.toml --check
        language: system
        pass_filenames: false
        files: ^tools/drdebits_build/

      - id: clippy
        name: lint the builder
        entry: cargo clippy --manifest-path tools/drdebits_build/Cargo.toml --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^tools/drdebits_build/

      - id: cargo-test
        name: builder tests
        entry: cargo test --manifest-path tools/drdebits_build/Cargo.toml --locked
        language: system
        pass_filenames: false

      - id: build-parity
        name: committed outputs match src/
        # The one gate that catches the mistake this repository is most prone
        # to: editing a generated file instead of its source fragment.
        entry: cargo run --manifest-path tools/drdebits_build/Cargo.toml --locked --release --quiet -- verify --root .
        language: system
        pass_filenames: false

      - id: whitespace
        name: git diff --cached --check
        # Pre-commit stashes unstaged changes; inspect the index being committed.
        entry: git diff --cached --check
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-ai-attribution
        name: refuse AI authorship credit
        # Install the commit-msg stage too: `pre-commit install --hook-type commit-msg`.
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
