# Local gates, matching .github/workflows/verify.yml.
#
# Every hook below runs the same command the workflow runs, through the same
# locked toolchain, so a hook that passes here cannot fail there on a version
# difference. `uv` must be on PATH; the workflow installs it with setup-uv.
#
# The build parity check matters most locally: CI rejects a hand edit to a
# generated file, and finding that out after a push means rewriting the commit.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: lint the builder
        entry: uv run --project tools/drdebits_build --locked --extra dev ruff check tools/drdebits_build/drdebits_build tools/drdebits_build/tests
        language: system
        pass_filenames: false
        files: ^tools/drdebits_build/

      - id: mypy
        name: typecheck the builder
        entry: uv run --project tools/drdebits_build --locked --extra dev mypy tools/drdebits_build/drdebits_build
        language: system
        pass_filenames: false
        files: ^tools/drdebits_build/

      - id: pytest
        name: build package tests
        entry: uv run --project tools/drdebits_build --locked --extra dev pytest tools/drdebits_build/tests -q
        language: system
        pass_filenames: false

      - id: build-parity
        name: committed outputs match src/
        # The one gate that catches the mistake this repository is most prone
        # to: editing a generated file instead of its source fragment.
        entry: uv run --project tools/drdebits_build --locked python -m drdebits_build verify --root .
        language: system
        pass_filenames: false

      - id: whitespace
        name: git diff --check
        entry: git diff --check
        language: system
        pass_filenames: false
