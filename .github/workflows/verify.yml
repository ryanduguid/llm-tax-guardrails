name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The builder's toolchain is pinned in rust-toolchain.toml.
env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.99"

jobs:
  changes:
    # A documentation-only pull request that no check reads skips the jobs
    # that need this one; .github/ci/docs_only.py decides, and the gate below
    # still reports.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.select.outputs.docs-only }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's parents give the pull request's changed paths.
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/docs_only.py select --checked src/ --checked reference/ --checked evals/ --checked tests/ --checked tools/ >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: build parity and structural checks
          - os: windows-latest
            name: Windows build and installation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tools/drdebits_build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint the builder
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run the builder tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked

      - name: Run the builder tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup component add llvm-tools-preview --toolchain "$RUST_TOOLCHAIN"
          cargo install cargo-llvm-cov --locked --version 0.9.1
          cargo llvm-cov --locked --lcov --output-path coverage-codecov.lcov --fail-under-lines 90

      - name: Keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: tools/drdebits_build/coverage-codecov.lcov
          retention-days: 1

      - name: Verify committed outputs against sources
        run: cargo run --locked --release --quiet -- verify --root ../..

  secrets:
    name: secret and client-identifier scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so a shallow checkout would leave every
          # earlier commit unscanned.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from verify-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.lcov
          disable_search: true
          fail_ci_if_error: true

  fuzzing:
    name: fuzz the YAML source reader
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/drdebits_build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned fuzzer
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the source reader
        run: >-
          cargo +nightly-2026-10-15 fuzz run sources fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  verify-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded (or, on a documentation-only pull
    # request, skipped), when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [changes, verify, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to succeed, or skip on a documentation-only pull request
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/docs_only.py gate
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/verify.yml verify-gates --no-results --exempt codecov --exempt fuzzing
