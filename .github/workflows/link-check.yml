name: Link check

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    timeout-minutes: 15
    name: live link check, report only
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Check and retain the report
        id: check
        shell: bash
        run: |
          set +e
          uv run --project tools/drdebits_build --locked python -m drdebits_build.linkcheck --root . > link-check.txt 2>&1
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          cat link-check.txt
          printf '### Verification result: %s\n\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          cat link-check.txt >> "$GITHUB_STEP_SUMMARY"
          # 0: checked; 1: finding; 2: incomplete. Any other code is an error.
          if [ "$result" -ne 0 ]; then
            echo "::warning::Verification needs review (exit $result); see the report."
          fi

      - name: Open or update the report issue
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          title="Link check: review required"
          printf '%s\n\n' 'SOURCE CURRENCY NOT CONFIRMED. Review the findings or incomplete checks below. An inaccessible source does not establish that it is superseded or dead. A checker error is not a source finding. Do not advance sources_checked_at without substantive human review.' > issue-body.txt
          printf 'Checker exit code: %s\n\n' "$CHECK_EXIT_CODE" >> issue-body.txt
          cat link-check.txt >> issue-body.txt
          reports="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq 'add | map(select(.pull_request == null)) | map(select(.title == "Link check: review required" or .title == "Link check: SOURCE CURRENCY NOT CONFIRMED for listed links")) | sort_by(.number) | map(.number | tostring) | join(" ")')"
          existing="${reports%% *}"
          if [ -n "$existing" ]; then
            gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq .body > old-body.txt
            if ! cmp -s old-body.txt issue-body.txt; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.txt
            fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.txt
          fi
          for duplicate in $reports; do
            if [ "$duplicate" != "$existing" ]; then
              gh issue close "$duplicate" --repo "$GITHUB_REPOSITORY" --comment "Monitoring continues in #$existing. This closes a duplicate report, not the substantive professional review."
            fi
          done

      - name: Record recovery
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reports="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq 'add | map(select(.pull_request == null)) | map(select(.title == "Link check: review required" or .title == "Link check: SOURCE CURRENCY NOT CONFIRMED for listed links")) | sort_by(.number) | map(.number | tostring) | join(" ")')"
          for existing in $reports; do
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment 'The latest automated check completed with exit 0. This closes the monitoring report, not the substantive professional review.'
          done

      - name: Require complete verification
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        shell: bash
        run: test "$CHECK_EXIT_CODE" = '0'
