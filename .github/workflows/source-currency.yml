name: Source currency

# Asks the Federal Register whether the compilations this guide pins are still
# the current ones. Link check answers a different question: a superseded
# compilation keeps resolving, so a green link check says nothing about
# currency.
#
# Report-only, like link check. A newer compilation is never grounds for this
# workflow to advance `sources_checked_at`: that date means a competent human
# read the material, and a changed compilation number is the trigger for that
# reading, not a substitute for it.

on:
  schedule:
    # Wednesday, away from the Sunday link check, so two reports do not land
    # together and get read as one.
    - cron: "0 21 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Compiling runs dependency build scripts, so it happens here, with
    # read-only access, and never in the job that can write issues.
    name: build the checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/drdebits_build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.99 --profile minimal

      - name: Build the checker
        run: cargo build --locked --release

      - name: Hand the checker to the report job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drdebits-build
          path: tools/drdebits_build/target/release/drdebits_build
          retention-days: 1

  compilations:
    needs: build
    timeout-minutes: 15
    name: pinned compilation currency, report only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job can write issues, so nothing it installs may run a build
      # script: it runs the checker the build job compiled.
      - name: Fetch the checker
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drdebits-build
          path: bin

      - name: Check and retain the report
        id: check
        shell: bash
        run: |
          set +e
          chmod +x bin/drdebits_build
          bin/drdebits_build sources --root . > source-currency.txt 2>&1
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          cat source-currency.txt
          printf '### Verification result: %s\n\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          cat source-currency.txt >> "$GITHUB_STEP_SUMMARY"
          # 0: checked; 1: finding; 2: incomplete. Any other code is an error.
          if [ "$result" -ne 0 ]; then
            echo "::warning::Verification needs review (exit $result); see the report."
          fi

      - name: Open or update the report issue
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          title="Source currency: review required"
          printf '%s\n\n' 'SOURCE CURRENCY NOT CONFIRMED. Review the findings or incomplete checks below. An inaccessible source does not establish that it is superseded or dead. A checker error is not a source finding. Do not advance sources_checked_at without substantive human review.' > issue-body.txt
          printf 'Checker exit code: %s\n\n' "$CHECK_EXIT_CODE" >> issue-body.txt
          cat source-currency.txt >> issue-body.txt
          reports="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" | jq -r 'add | map(select(.pull_request == null)) | map(select(.title == "Source currency: review required" or .title == "Source currency: a pinned compilation has been superseded")) | sort_by(.number) | map(.number | tostring) | join(" ")')"
          existing="${reports%% *}"
          if [ -n "$existing" ]; then
            gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq .body > old-body.txt
            if ! cmp -s old-body.txt issue-body.txt; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.txt
            fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.txt
          fi
          for duplicate in $reports; do
            if [ "$duplicate" != "$existing" ]; then
              gh issue close "$duplicate" --repo "$GITHUB_REPOSITORY" --comment "Monitoring continues in #$existing. This closes a duplicate report, not the substantive professional review."
            fi
          done

      - name: Record recovery
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reports="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" | jq -r 'add | map(select(.pull_request == null)) | map(select(.title == "Source currency: review required" or .title == "Source currency: a pinned compilation has been superseded")) | sort_by(.number) | map(.number | tostring) | join(" ")')"
          for existing in $reports; do
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment 'The latest automated check completed with exit 0. This closes the monitoring report, not the substantive professional review.'
          done

      - name: Require complete verification
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        shell: bash
        run: test "$CHECK_EXIT_CODE" = '0'
