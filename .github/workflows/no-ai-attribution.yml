name: No AI attribution

# Fails a pull request that carries AI authorship credit in its description or
# in commit messages or author and committer identities on the branch.
# Product references are allowed.
#
# The local commit-msg guard catches commits written on Ryan's machine; this
# workflow checks pull request metadata from the trusted base branch and audits
# commits after a default-branch push. It never runs pull request code.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: attribution-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy:
    if: github.event_name == 'pull_request'
    name: check
    runs-on: ubuntu-latest
    steps: &policy_steps
      - name: Mark the head commit as pending
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_CONTEXT: ${{ github.event_name == 'pull_request_target' && 'Attribution policy' || 'Attribution audit' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --method POST \
            -f state=pending -f context="$POLICY_CONTEXT" \
            -f description='Checking commit identities and authorship credits' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Scan pull request metadata and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import unicodedata

          VENDOR = (r"(?:claude|anthropic|codex|openai|cursor|hermes|nousresearch|"
                    r"copilot|chatgpt|gemini|devin|codeium|windsurf|antigravity|aider|qodo|openhands|cascade)")

          # Domains for the bare-URL rule, kept in step with VENDOR.
          DOMAIN = (r"(?:claude\.ai|claude\.com|anthropic\.com|openai\.com|"
                    r"chatgpt\.com|cursor\.com|cursor\.sh|codeium\.com|"
                    r"windsurf\.com|cognition\.ai|devin\.ai|nousresearch\.com|qodo\.ai|openhands\.dev|all-hands\.dev)")

          AI_NAME = re.compile(
              r"(?:anthropic|codex|openai|cursor|nousresearch|copilot|chatgpt|"
              r"codeium|windsurf|antigravity|aider|qodo|openhands)|" +
              VENDOR + r"(?:[-_ ](?:agent|code|bot)(?:\[bot\])?|\[bot\])|"
              + VENDOR + r"(?:[-_ ][a-z0-9]+)+\[bot\]|"
              r"claude (?:opus|sonnet|haiku|fable)(?: [0-9.]+)?|"
              r"hermes review|review (?:bot|agent|fixes)|"
              r"(?:openai[-_ ]codex|github[-_ ]copilot|qodo[-_ ]code[-_ ]review|gemini[-_ ]code[-_ ]assist)(?:\[bot\])?", re.I)

          def comparable(text):
              # Compare visible letters without hidden characters or combining marks.
              return "".join(" " if char.isspace() else "-" if unicodedata.category(char) == "Pd" else char
                             for char in unicodedata.normalize("NFKD", text)
                             if (char.isprintable() or char.isspace()) and not unicodedata.category(char).startswith("M"))

          CREDIT_VERB = (r"(?:generated|addressed|authored|written|created|produced|"
                         r"reviewed|fixed|resolved|implemented|assisted|handled)")

          PATTERNS = [
              ("co-author trailer",
               r"^\s*co-?authored-by:\s*.*" + VENDOR),
              # Both "Addressed-by: Claude" and "Assisted by Claude" forms.
              ("agent by-line trailer",
               r"^\s*" + CREDIT_VERB + r"[-_ ]by:\s*.*" + VENDOR),
              ("session trailer",
               r"^\s*" + VENDOR + r"[-_ ]?(?:session|run|thread|trace|id):"),
              ("robot emoji credit",
               r"^\s*_?\s*\U0001F916.*" + VENDOR),
              ("generated-with footer",
               r"^\s*_?" + CREDIT_VERB + r"\s+(?:with|by)\s+\[?[^\]\n]*" + VENDOR),
              ("bare vendor url",
               r"^\s*[_<(]*https?://(?:[\w.-]+\.)?" + DOMAIN + r"\b"),
          ]
          RX = [(name, re.compile(p, re.I)) for name, p in PATTERNS]

          FENCE = re.compile(r"^(?P<indent> {0,3})(?P<fence>`{3,}|~{3,})(?P<info>.*)$")

          def scan(label, text):
              """Report every credit line outside fenced code blocks.

              Fence state tracks the opening character and length, per CommonMark:
              a closing fence must use the same character, be at least as long, and
              carry no info string. Tracking the character and length stops a
              shorter or different fence from ending a block early, and stops an
              indented code line that merely looks like a fence from flipping the
              state for the rest of the document.
              """
              bad = []
              open_char = None
              open_len = 0
              for n, line in enumerate(text.split("\n"), 1):
                  m = FENCE.match(line)
                  if m:
                      ch = m.group("fence")[0]
                      length = len(m.group("fence"))
                      if open_char is None:
                          open_char, open_len = ch, length
                          continue
                      if ch == open_char and length >= open_len and not m.group("info").strip():
                          open_char, open_len = None, 0
                          continue
                  if open_char is not None:
                      continue
                  for name, rx in RX:
                      if rx.match(comparable(line)):
                          bad.append("%s line %d: %s (%s)"
                                     % (label, n, line.strip()[:120], name))
                          break
              return bad

          # Titles are plain text. Whole-word names and one separator grammar
          # keep punctuation variants consistent without matching human surnames.
          SEP = r"[\W_]+"
          TOOL = (r"(?<!\w)(?:github(?:['\u2019]s)?" + SEP + r")?" + VENDOR +
                  r"(?!\w)(?:" + SEP + r"(?:code|agent|bot|assist|review|codex)(?!\w))*")
          DESCRIPTOR = (r"(?:(?:the|ai|assistant|agent|bot|and|by|with|via|using)" + SEP + r")*")
          title_credit = re.compile(
              r"(?<!\w)" + CREDIT_VERB + SEP + r"(?:by|with|via|using)" + SEP +
              DESCRIPTOR + TOOL, re.I)
          reverse_credit = re.compile(TOOL + SEP + CREDIT_VERB + r"(?!\w)", re.I)
          coauthors = re.compile(r"\bco[-_ ]?authored" + SEP + r"by" + SEP, re.I)

          def scan_pr(title, body):
              text = comparable(title or "").replace("_", " ")
              bad = []
              # Remove only the technical object, preserving any following credit.
              text = re.sub(
                  r"(\bimplemented" + SEP + r"(?:with|via|using)" + SEP + r")"
                  r"(?:cursor[- ]+(?:based[- ]+)?pagination|cascade[- ]+deletion)\b",
                  r"\1", text, flags=re.I)
              text = re.sub(
                  r"(\berrors?" + SEP + r"generated" + SEP + r"by" + SEP + r")" + TOOL + SEP + r"API\b",
                  r"\1", text, flags=re.I)
              if title_credit.search(text):
                  bad.append("pull request title: authorship credit")
              for match in coauthors.finditer(text):
                  # An explicit clause separator ends the list of credited names.
                  names = re.split(r"\s+-\s+|[:;|\n]", text[match.end():], maxsplit=1)[0]
                  if re.search(TOOL, names, re.I):
                      bad.append("pull request title: co-author credit")
              for match in reverse_credit.finditer(text):
                  # A handling verb makes the tool's output the object of the task.
                  if re.search(r"\b(?:handle|parse|validate|reject|block|detect|filter|remove|ignore|test)\s+$",
                               text[:match.start()], re.I):
                      continue
                  bad.append("pull request title: authorship credit")
              # ponytail: explicit credit grammar; ambiguous prose still needs review.
              return bad + scan("pull request body", body or "")

          # Keep the reviewed title regressions executable in every installed copy.
          for title, blocked in (
              ("Generated-by-Claude", True),
              ("Generated: by OpenAI", True),
              ("Implemented with GitHub's Copilot", True),
              ("Implemented using AI assistant Claude", True),
              ("Claude Code authored this change", True),
              ("Claude-created this PR", True),
              ("Claude: authored this PR", True),
              ("Co-authored-by: Jane and Claude", True),
              ("Implemented with Cursor pagination by Claude", True),
              ("Implemented with Cursor pagination and Claude", True),
              ("Fix errors generated by OpenAI API by Claude", True),
              ("Implemented via cursor-based pagination", False),
              ("Implemented using Cascade deletion", False),
              ("Handle OpenAI-generated API errors", False),
              ("Handle cursor-generated pagination tokens", False),
              ("Reject OpenAI-authored commits", False),
              ("Co-authored-by: Alice - OpenAI integration", False),
              ("Co-authored-by: Claudette", False),
              ("Handle precursor-generated records", False),
              ("Raider-authored documentation", False),
          ):
              if bool(scan_pr(title, "")) != blocked:
                  sys.exit("Attribution policy self-test failed")

          failures = scan_pr(os.environ.get("PR_TITLE"), os.environ.get("PR_BODY"))

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          # The policy runs from the base branch. Fetch PR objects as data only.
          for ref in (base, head):
              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                  sys.exit("Invalid commit identifier")
              if ref == "0" * 40:
                  continue
              present = subprocess.run(["git", "cat-file", "-e", ref + "^{commit}"],
                                       capture_output=True)
              if present.returncode:
                  fetched = subprocess.run(["git", "fetch", "--no-tags", "origin", ref],
                                           capture_output=True, text=True)
                  if fetched.returncode:
                      sys.exit("Could not read the commit range: commit fetch failed")
          commit_range = head if base == "0" * 40 else base + ".." + head
          proc = subprocess.run(
              ["git", "rev-list", commit_range], capture_output=True, text=True)
          if proc.returncode != 0:
              # Fail closed: an unscannable range must not read as clean.
              print("Could not read the commit range %s..%s" % (base[:12], head[:12]))
              print(proc.stderr.strip()[:500])
              sys.exit(1)

          for sha in proc.stdout.splitlines():
              raw = subprocess.run(["git", "cat-file", "commit", sha],
                                   capture_output=True, check=True).stdout
              headers, msg = raw.split(b"\n\n", 1)
              # Read the commit structure directly: control bytes in names cannot
              # shift fields, and mailmap aliases cannot conceal raw identities.
              for role in ("author", "committer"):
                  values = [line[len(role) + 1:] for line in headers.decode("utf-8").split("\n")
                            if line.startswith(role + " ")]
                  if len(values) != 1:
                      sys.exit("Missing or duplicate commit identity")
                  identity = re.fullmatch(r"([^<>\n]*) <([^<>\n]*)> -?[0-9]+ [+-][0-9]{4}", values[0])
                  if identity is None:
                      sys.exit("Malformed commit identity")
                  name, email = identity.groups()
                  if any(not char.isprintable() or char == "\ufffd" for char in name + email):
                      sys.exit("Non-printable commit identity")
                  name, email = comparable(name), comparable(email.strip())
                  account = re.fullmatch(r"(?:[0-9]+\+)?([^@]+)@users\.noreply\.github\.com", email, re.I)
                  if (AI_NAME.fullmatch(name.strip()) or email.casefold() in {"noreply@anthropic.com", "openhands@all-hands.dev", "cascade@windsurf.com"}
                          or (account and AI_NAME.fullmatch(account[1]))):
                      failures.append("commit %s: AI %s identity" % (sha[:12], role))
              failures += scan("commit " + sha[:12], msg.decode("utf-8", "replace"))

          if failures:
              print("AI attribution found:\n")
              for f in failures:
                  print("  " + f)
              print("\nRemove AI credits and correct AI author or committer identities before merging.")
              sys.exit(1)
          print("No AI attribution found.")
          PY

      - name: Publish the result on the head commit
        if: ${{ always() && !cancelled() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_CONTEXT: ${{ github.event_name == 'pull_request_target' && 'Attribution policy' || 'Attribution audit' }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --method POST \
            -f state="$STATE" -f context="$POLICY_CONTEXT" \
            -f description='Commit identity and authorship credit policy' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

  policy:
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    name: Attribution policy runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps: *policy_steps
