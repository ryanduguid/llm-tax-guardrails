name: No AI attribution

# Fails a pull request that carries AI authorship credit in its description or
# in commit messages or author and committer identities on the branch.
# Product references are allowed.
#
# The local commit-msg guard catches commits written on Ryan's machine; this
# workflow hands pull request metadata to the shared Attribution policy runner
# from the trusted base branch and audits commits after a default-branch push.
# It never runs pull request code.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Attribution policy
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ryanduguid/release-policy/.github/workflows/attribution-policy.yml@ba94d055c28cfae801a3d663404156b2af36cdd6
