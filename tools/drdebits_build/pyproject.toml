[project]
name = "drdebits-build"
version = "0.1.0"
description = "Deterministic build and verification tooling for the DrDebits guide"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5", "mypy==2.3.1", "pytest==9.1.1", "types-pyyaml==6.0.12.20260815"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drdebits_build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["drdebits_build", "tests"]

[tool.ruff.lint]
# Syntax and undefined names (E9, F82), the rest of pyflakes (unused imports
# and variables, f-strings with no placeholder, shadowed definitions), the
# import-shape and statement-shape pycodestyle errors (E4, E7), and import
# sorting (I). E5 stays out: line-length is set below for the formatter, and
# reflowing the long header templates would change generated output.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
packages = ["drdebits_build"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
pretty = true

