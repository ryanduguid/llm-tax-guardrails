[package]
name = "drdebits-build"
version = "1.0.0"
description = "Deterministic build and verification tooling for the DrDebits guide"
license = "FSL-1.1-ALv2 AND MIT"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "drdebits"
path = "src/lib.rs"

[[bin]]
name = "drdebits_build"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dns-lookup = "4"
fancy-regex = "0.19.2"
num-bigint = "0.5.1"
num-traits = "0.2.19"
regex = "1.13.1"
sha2 = "0.11.1"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
